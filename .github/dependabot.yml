version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"
    # Node majors are upgraded by hand, and only to LTS releases: newer images can drop tools the
    # Dockerfile relies on (node:25 no longer ships corepack).
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
